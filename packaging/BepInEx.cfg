# Release defaults, based on EnhancedNetwork/TownofHost-Enhanced packaging.
# Other options use the defaults supplied by BepInEx 6.0.0-be.755.

[IL2CPP]
UpdateInteropAssemblies = true
UnityBaseLibrariesSource = https://unity.bepinex.dev/libraries/{VERSION}.zip
ScanMethodRefs = false
DumpDummyAssemblies = false
PreloadIL2CPPInteropAssemblies = true

[Logging.Console]
Enabled = false

[Logging.Disk]
Enabled = true
LogLevels = Fatal, Error, Warning, Message, Info
InstantFlushing = false
